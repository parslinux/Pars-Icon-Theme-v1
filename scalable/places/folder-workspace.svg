<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     role="img"
     aria-label="Pars Linux Workspace Folder">

  <!-- Sol üst çalışma paneli -->
  <rect
    x="14"
    y="14"
    width="15"
    height="15"
    rx="3"
    fill="#FFFFFF"/>

  <!-- Sağ üst çalışma paneli -->
  <rect
    x="35"
    y="14"
    width="15"
    height="15"
    rx="3"
    fill="#FFFFFF"/>

  <!-- Sol alt çalışma paneli -->
  <rect
    x="14"
    y="35"
    width="15"
    height="15"
    rx="3"
    fill="#FFFFFF"/>

  <!-- Sağ alt aktif çalışma paneli -->
  <rect
    x="35"
    y="35"
    width="15"
    height="15"
    rx="3"
    fill="#3B82F6"/>

  <!-- Pars altıgeni -->
  <polygon
    points="32,25
            38,28.5
            38,35.5
            32,39
            26,35.5
            26,28.5"
    fill="#0F172A"/>

  <!-- Merkez vurgusu -->
  <circle
    cx="32"
    cy="32"
    r="2.5"
    fill="#3B82F6"/>

</svg>
